name: Publish verified ARM64 APK
on:
  push:
    branches: [codex/verified-apk-publication]
    paths: [release-payload/**, .github/workflows/publish-verified-apk.yml]
permissions:
  contents: write
concurrency:
  group: publish-verified-arm64-apk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
      - name: Verify exact locally built APK
        run: |
          cd release-payload
          sha256sum -c SHA256SUMS
          python3 ../tools/verify-apk.py MegaManZeroNative-1.0.0-rc.1-arm64-v8a.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$build_tools/apksigner" ]]; then "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'; fi
          "$build_tools/apksigner" verify --verbose MegaManZeroNative-1.0.0-rc.1-arm64-v8a.apk
          "$build_tools/zipalign" -c -P 16 -v 4 MegaManZeroNative-1.0.0-rc.1-arm64-v8a.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MegaManZeroNative-1.0.0-rc.1-arm64
          path: |
            release-payload/*.apk
            release-payload/SHA256SUMS
          if-no-files-found: error
      - name: Upload and publish existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload android-v1.0.0-rc.1 release-payload/*
          gh release edit android-v1.0.0-rc.1 --draft=false --prerelease
          gh release view android-v1.0.0-rc.1 --json url,assets
