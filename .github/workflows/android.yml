name: Android ARM64
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release de teste (ex.: android-v0.1.0-test.1)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  apk:
    # The upstream corpus is not public. User-owned ROM/BIOS must be installed
    # on this runner, not committed or uploaded to Actions/release artifacts.
    runs-on: [self-hosted, linux, x64, mmz-private-assets]
    env:
      MMZ_ROM_PATH: ${{ vars.MMZ_ROM_PATH }}
      MMZ_BIOS_PATH: ${{ vars.MMZ_BIOS_PATH }}
      ANDROID_HOME: /workspace/android-sdk
      ANDROID_USER_HOME: /workspace/.android
      GRADLE_USER_HOME: /workspace/.gradle
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
      - name: Validate release tag and private inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]
          test -f "$MMZ_ROM_PATH"
          test -f "$MMZ_BIOS_PATH"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned tools and run host checks
        run: bash tools/setup-cloud.sh
      - name: Generate verified native corpus
        run: python3 tools/generate.py --rom "$MMZ_ROM_PATH" --bios "$MMZ_BIOS_PATH"
      - name: Build, verify ABI, signature and alignment
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: GBARECOMP_VERSION_NAME="${RELEASE_TAG#android-v}" bash tools/build-android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MegaManZeroNative-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" android/app/build/outputs/apk/release/app-release.apk \
            --target "$GITHUB_SHA" --prerelease --title "Mega Man Zero Native $RELEASE_TAG" \
            --notes "Build ARM64 de teste; Android 9+. Importe sua ROM USA revisão 0 e BIOS GBA. Sem ROM/BIOS no APK. Build aprovado não comprova gameplay em dispositivo."
